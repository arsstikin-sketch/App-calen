<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#F3F1EC;--card:#fff;--ink:#16181D;--ink2:#5B5F69;--ink3:#9A9DA5;--line:#E6E3DC;--accent:#2F5BEA;--accent-soft:#E7EDFD;--ok:#1F9D6B;--bad:#D64545;--warn:#D9822B}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
header img{width:40px;height:40px;border-radius:11px}
header h1{font-size:20px;margin:0;letter-spacing:-.01em}
header small{display:block;color:var(--ink2);font-size:13px;font-weight:600}

.lnk{color:var(--accent);font-weight:700;text-decoration:none;font-size:14px}

<body>
<div class="wrap">
  <header><img src="icons/icon-192.png" alt=""><div><h1>Расписание · Руководство</h1><small>Загрузка расписания для студентов и преподавателей</small></div><span class="sp"></span>
    <a class="lnk" href="./" target="_blank" rel="noopener">Открыть приложение ↗</a><button class="btn-ghost hidden" id="logout">Выйти</button></header>
  <div id="root"><div class="card narrow center muted">Загрузка…</div></div>
</div>
<input type="file" id="xlsx" accept=".xlsx" class="hidden">

<script>
/* =====================================================================
   1. Мини-читалка .xlsx (zip + xml), без внешних библиотек
   ===================================================================== */
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Это не похоже на файл .xlsx");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  const td = new TextDecoder();
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen));
    files[name] = { method, csize, loff };
    p += 46 + nlen + elen + clen;
  }
  async function read(name){
    const f = files[name]; if (!f) return null;
    const ln = dv.getUint16(f.loff + 26, true), le = dv.getUint16(f.loff + 28, true);
    const start = f.loff + 30 + ln + le;
    const data = u8.subarray(start, start + f.csize);
    let out;
    if (f.method === 0) out = data;
    else if (f.method === 8) {
      const s = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      out = new Uint8Array(await new Response(s).arrayBuffer());
    } else throw new Error("Неизвестное сжатие в файле");
    return new TextDecoder("utf-8").decode(out);
  }
  return { files, read };
}
const xml = s => new DOMParser().parseFromString(s, "application/xml");
const tags = (el, name) => Array.from(el.getElementsByTagNameNS("*", name));
function colNum(letters){ let n = 0; for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
function ref(r){ const m = /^([A-Z]+)(\d+)$/.exec(r); return { c: colNum(m[1]), r: +m[2] }; }

async function readWorkbook(buf){
  const z = await unzip(buf);
  const wb = xml(await z.read("xl/workbook.xml"));
  const rels = xml(await z.read("xl/_rels/workbook.xml.rels"));
  const relMap = {};
  tags(rels, "Relationship").forEach(r => relMap[r.getAttribute("Id")] = r.getAttribute("Target"));
  let shared = [];
  const ssx = await z.read("xl/sharedStrings.xml");
  if (ssx) shared = tags(xml(ssx), "si").map(si => tags(si, "t").map(t => t.textContent).join(""));
  const sheets = [];
  for (const sh of tags(wb, "sheet")) {
    const rid = sh.getAttribute("r:id") || sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    let target = relMap[rid] || ""; target = target.replace(/^\//, "");
    if (!target.startsWith("xl/")) target = "xl/" + target;
    const sx = await z.read(target); if (!sx) continue;
    const d = xml(sx);
    const cells = new Map(); let maxR = 0, maxC = 0;
    for (const c of tags(d, "c")) {
      const { r, c: cc } = ref(c.getAttribute("r"));
      const t = c.getAttribute("t");
      let v = null;
      if (t === "s") { const vv = tags(c, "v")[0]; v = vv ? shared[+vv.textContent] : null; }
      else if (t === "inlineStr") v = tags(c, "t").map(x => x.textContent).join("");
      else { const vv = tags(c, "v")[0]; v = vv ? vv.textContent : null; }
      if (v != null && String(v).trim() !== "") { cells.set(r + "," + cc, String(v)); maxR = Math.max(maxR, r); maxC = Math.max(maxC, cc); }
    }
    const mergeOf = new Map(); const spans = new Map();
    for (const m of tags(d, "mergeCell")) {
      const [a, b] = m.getAttribute("ref").split(":"); const A = ref(a), B = ref(b || a);
      spans.set(A.r + "," + A.c, { r1: A.r, c1: A.c, r2: B.r, c2: B.c });
      for (let r = A.r; r <= B.r; r++) for (let c = A.c; c <= B.c; c++) mergeOf.set(r + "," + c, A.r + "," + A.c);
    }
    sheets.push({
      name: sh.getAttribute("name"), maxR, maxC,
      raw: (r, c) => cells.get(r + "," + c) ?? null,
      val: (r, c) => cells.get(mergeOf.get(r + "," + c) || (r + "," + c)) ?? null,
      span: (r, c) => spans.get(r + "," + c) || { r1: r, c1: c, r2: r, c2: c },
    });
  }
  return sheets;
}

/* =====================================================================
   2. Разбор расписания из листов
   ===================================================================== */
const DAY_NAMES = ["ПОНЕДЕЛЬНИК","ВТОРНИК","СРЕДА","ЧЕТВЕРГ","ПЯТНИЦА","СУББОТА","ВОСКРЕСЕНЬЕ"];
const TIME_RE = /(\d{1,2})[.:](\d{2})\s*[-–]\s*(\d{1,2})[.:](\d{2})/;
const pad = n => String(n).padStart(2, "0");

function parseLessonText(text){
  const full = text.replace(/\r/g, "").split(/\n/).map(s => s.trim()).filter(Boolean).join("\n");
  let name, type = "", rest;
  const m = /\((лек|пз|лаб|пр|сем|кср|экз|зач|конс)[^)]*\)/i.exec(full);
  if (m) { name = full.slice(0, m.index); type = m[1].toLowerCase(); rest = full.slice(m.index + m[0].length); }
  else { const lines = full.split("\n"); name = lines[0] || ""; rest = lines.slice(1).join(", "); }
  name = name.replace(/\s+/g, " ").trim();
  rest = rest.replace(/^[\s,]+/, "").replace(/\n/g, ", ").replace(/\s+/g, " ").trim();
  let room = "", teacher = rest;
  const rm = /ауд\.?\s*([\d][\d\s,]*)/i.exec(rest);
  if (rm) { room = "ауд. " + rm[1].replace(/\s+/g, "").replace(/,$/, "").replace(/,/g, ", "); teacher = rest.slice(0, rm.index); }
  else if (/[сc]\s*\/\s*з/i.test(rest)) { room = "спортзал"; teacher = rest.replace(/,?\s*[сc]\s*\/\s*з.*$/i, ""); }
  else if (/online|онлайн/i.test(rest)) { room = "онлайн"; teacher = rest.replace(/online,?\s*/i, ""); }
  teacher = teacher.replace(/[,\s]+$/, "").trim();
  return { name, type, room, teacher };
}
/* ФИО преподавателя из строки «доцент Иванов И.И.» */
function teacherName(s){
  const m = /([А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?)\s+([А-ЯЁ])\.\s*([А-ЯЁ])\.?/.exec(s || "");
  return m ? `${m[1]} ${m[2]}.${m[3]}.` : null;
}
function teacherPost(s){ const n = teacherName(s); if (!n) return ""; return (s.slice(0, s.indexOf(n.split(" ")[0])) || "").replace(/[,\s]+$/, "").trim(); }
function roomKeys(room){
  if (!room) return [];
  if (room === "онлайн") return [];
  if (room === "спортзал") return ["спортзал"];
  return room.replace(/^ауд\.\s*/, "").split(/\s*,\s*/).filter(Boolean);
}

function parseSchedule(sheets){
  const groups = {}; let weeks = []; let pairs = []; let yearStart = null;
  // учебный год
  for (const s of sheets) {
    for (let r = 1; r <= Math.min(s.maxR, 15) && !yearStart; r++) for (let c = 1; c <= s.maxC; c++) {
      const v = s.raw(r, c); const m = v && /(20\d\d)\s*[-–]\s*(20\d\d)\s*уч/i.exec(v);
      if (m) { yearStart = +m[1]; break; }
    }
  }
  if (!yearStart) { const n = new Date(); yearStart = n.getMonth() >= 7 ? n.getFullYear() : n.getFullYear() - 1; }

  for (const s of sheets) {
    // режим занятий и чередование недель
    for (let r = 1; r <= s.maxR; r++) {
      const a = (s.raw(r, 1) || "").trim();
      const pm = /^(\d)\s*пара/i.exec(a); const tv = s.raw(r, 2);
      if (pm && tv && TIME_RE.test(tv)) { const t = TIME_RE.exec(tv); pairs.push({ n: +pm[1], start: pad(t[1]) + ":" + t[2], end: pad(t[3]) + ":" + t[4] }); }
      for (let c = 1; c <= 2; c++) {
        const v = (s.raw(r, c) || "").trim();
        const dm = /^(\d{1,2})\.(\d{1,2})\s*[-–]\s*(\d{1,2})\.(\d{1,2})$/.exec(v);
        if (dm && /нечет|четн/i.test((s.raw(r - 1, c) || "") + (s.raw(r - 2, c) || "") + (s.raw(r - 3, c) || "") + collectAbove(s, r, c))) {
          const y = mo => (mo >= 8 ? yearStart : yearStart + 1);
          const from = `${y(+dm[2])}-${pad(dm[2])}-${pad(dm[1])}`, to = `${y(+dm[4])}-${pad(dm[4])}-${pad(dm[3])}`;
          weeks.push({ from, to, parity: c === 1 ? "odd" : "even" });
        }
      }
    }
    // блоки групп: ищем ячейки «Время»
    for (let r = 1; r <= s.maxR; r++) for (let c = 1; c <= s.maxC; c++) {
      if ((s.raw(r, c) || "").trim().toLowerCase() !== "время") continue;
      const gname = (s.val(r, c + 1) || "").trim(); if (!gname) continue;
      const lessons = []; let day = -1;
      for (let rr = r + 1; rr <= s.maxR; rr++) {
        const tcell = (s.raw(rr, c) || "").trim();
        if (/^время$/i.test(tcell) || /согласовано/i.test(tcell)) break;
        const head = (s.val(rr, c + 1) || "").trim().toUpperCase();
        const di = DAY_NAMES.indexOf(head);
        if (di >= 0 && !TIME_RE.test(tcell)) { day = di; continue; }
        const tm = TIME_RE.exec(tcell);
        if (!tm || day < 0) continue;
        const sp = s.span(rr, c);
        const rows = sp.r2 > sp.r1 ? [sp.r1, sp.r1 + 1] : [rr];
        const found = new Map();
        rows.forEach((row, wi) => [c + 1, c + 2].forEach((col, si) => {
          const v = s.val(row, col); if (!v || !v.trim()) return;
          if (DAY_NAMES.includes(v.trim().toUpperCase())) return;
          const key = v.trim();
          if (!found.has(key)) found.set(key, { cells: [] });
          const f = found.get(key);
          const ws = rows.length === 1 ? ["odd", "even"] : [wi === 0 ? "odd" : "even"];
          ws.forEach(w => f.cells.push({ w, s: si + 1 }));
        }));
        for (const [text, f] of found) {
          // подгруппы с одинаковым набором недель объединяем, иначе — отдельные записи
          const bySub = new Map();
          for (const cell of f.cells) { if (!bySub.has(cell.s)) bySub.set(cell.s, new Set()); bySub.get(cell.s).add(cell.w); }
          const byWeeks = new Map();
          for (const [sub, ws] of bySub) { const k = [...ws].sort().join("/"); if (!byWeeks.has(k)) byWeeks.set(k, []); byWeeks.get(k).push(sub); }
          for (const [k, subsArr] of byWeeks)
            lessons.push({ day, start: pad(tm[1]) + ":" + tm[2], end: pad(tm[3]) + ":" + tm[4], ...parseLessonText(text), weeks: k.split("/"), subs: subsArr.sort() });
        }
      }
      if (!groups[gname] || lessons.length > groups[gname].lessons.length) groups[gname] = { sheet: s.name, lessons };
    }
  }
  pairs = dedupe(pairs, p => p.n).sort((a, b) => a.n - b.n);
  weeks = dedupe(weeks, w => w.from).sort((a, b) => a.from.localeCompare(b.from));
  return { groups, weeks, pairs, yearStart };
}
function collectAbove(s, r, c){ let t = ""; for (let k = r - 1; k >= Math.max(1, r - 14); k--) t += s.raw(k, c) || ""; return t; }
function dedupe(arr, key){ const m = new Map(); arr.forEach(x => m.set(key(x), x)); return [...m.values()]; }


</script>
<script>
const OWNER = "arsstikin-sketch", REPO = "App-calen", BRANCH = "main";
let API = "https://api.github.com";
try { const q = new URLSearchParams(location.search).get("api"); if (q && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) API = q; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (d, o) => new Intl.DateTimeFormat("ru-RU", o).format(d);
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
function fmtStamp(s){ if (!s) return "—"; const d = new Date(s); return `${fmt(d, { day: "numeric", month: "long" })}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function plural(n, a, b, c){ const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); }

/* ---------- base64 / шифрование ---------- */
const enc = s => new TextEncoder().encode(s);
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey("raw", enc(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function lockToken(token, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await deriveKey(pw, salt, iter), enc(token)));
  return { v: 1, kdf: "PBKDF2-SHA256", iter, salt: b64(salt), iv: b64(iv), ct: b64(ct), updated: new Date().toISOString() };
}
async function unlockToken(cfg, pw){
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(cfg.iv) }, await deriveKey(pw, unb64(cfg.salt), cfg.iter), unb64(cfg.ct));
  return new TextDecoder().decode(pt);
}

/* ---------- GitHub ---------- */
let TOKEN = null, PASSWORD = null, CFG = null;
async function gh(path, opts = {}, token = TOKEN){
  const r = await fetch(`${API}/repos/${OWNER}/${REPO}${path}`, { cache: "no-store", ...opts, headers: { "Accept": "application/vnd.github+json", ...(token ? { "Authorization": `Bearer ${token}` } : {}), ...(opts.headers || {}) } });
  if (r.status === 404) return null;
  if (!r.ok) { const e = new Error(`GitHub ${r.status}`); e.status = r.status; try { e.body = await r.json(); } catch (x) {} throw e; }
  return r.json();
}
async function readFile(path, token = TOKEN){
  const d = await gh(`/contents/${path}?ref=${BRANCH}&t=${Date.now()}`, {}, token); if (!d) return null;
  let text;
  if (d.content) text = new TextDecoder().decode(unb64(d.content));
  else { const raw = await fetch(d.download_url + "?t=" + Date.now(), { cache: "no-store" }); text = await raw.text(); }
  return { json: JSON.parse(text), sha: d.sha };
}
async function writeFile(path, obj, message, token = TOKEN){
  const cur = await gh(`/contents/${path}?ref=${BRANCH}&t=${Date.now()}`, {}, token);
  const body = { message, content: b64(enc(typeof obj === "string" ? obj : JSON.stringify(obj))), branch: BRANCH };
  if (cur && cur.sha) body.sha = cur.sha;
  return gh(`/contents/${path}`, { method: "PUT", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } }, token);
}
function ghError(e){
  if (e.status === 401) return "Ключ GitHub недействителен или истёк. Нужно создать новый (см. ниже).";
  if (e.status === 403) return "У ключа нет права записи. При создании ключа выдайте Contents: Read and write для репозитория " + REPO + ".";
  if (e.status === 409 || e.status === 422) return "Конфликт при сохранении. Попробуйте ещё раз.";
  return "Ошибка связи с GitHub" + (e.status ? ` (${e.status})` : "") + ". Проверьте интернет и попробуйте ещё раз.";
}

/* ---------- экраны ---------- */
const root = () => $("root");
async function start(){
  try { CFG = (await readFile("config/admin.json", null))?.json || null; }
  catch (e) { try { const r = await fetch("config/admin.json?t=" + Date.now(), { cache: "no-store" }); CFG = r.ok ? await r.json() : null; } catch (x) { CFG = null; } }
  CFG ? showLogin() : showSetup();
}

const TOKEN_HELP = `<ol class="steps">
  <li>Откройте <a class="lnk" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Settings → Fine-grained tokens → Generate new token</a> (под аккаунтом владельца репозитория).</li>
  <li><b>Token name:</b> <code>Расписание</code>. <b>Expiration:</b> самый долгий срок (Custom → через год).</li>
  <li><b>Repository access:</b> Only select repositories → <code>${REPO}</code>.</li>
  <li><b>Permissions → Repository permissions → Contents:</b> <code>Read and write</code>. Больше ничего не нужно.</li>
  <li>Нажмите <b>Generate token</b>, скопируйте ключ (начинается с <code>github_pat_</code>) и вставьте сюда.</li></ol>`;

function showSetup(){
  root().innerHTML = `<div class="card narrow" style="max-width:600px;margin-top:20px"><h2>Первичная настройка</h2>
    <p class="lead">Делается один раз. Вы даёте странице ключ доступа к GitHub и придумываете пароль. Ключ сохранится в репозитории только в зашифрованном виде: без пароля им воспользоваться нельзя.</p>
    ${TOKEN_HELP}
    <label>Ключ GitHub</label><input type="password" id="tok" placeholder="github_pat_…" autocomplete="off">
    <label>Пароль для руководства</label><input type="password" id="pw1" placeholder="Не короче 10 символов" autocomplete="new-password">
    <label>Пароль ещё раз</label><input type="password" id="pw2" autocomplete="new-password">
    <button class="primary" id="go">Сохранить и войти</button><div class="prog" id="prog"><i></i></div><div class="err" id="err"></div>
    <p class="muted" style="margin-top:14px">Пароль нигде не хранится и не восстанавливается. Забыли — создайте новый ключ и пройдите настройку заново (файл <code>config/admin.json</code> в репозитории нужно будет удалить).</p></div>`;
  $("go").onclick = async () => {
    const tok = $("tok").value.trim(), p1 = $("pw1").value, p2 = $("pw2").value; const err = $("err"); err.textContent = "";
    if (!/^(github_pat_|ghp_)/.test(tok)) return err.textContent = "Вставьте ключ GitHub (начинается с github_pat_).";
    if (p1.length < 10) return err.textContent = "Пароль должен быть не короче 10 символов.";
    if (p1 !== p2) return err.textContent = "Пароли не совпадают.";
    busy(true);
    try {
      const cfg = await lockToken(tok, p1);
      await writeFile("config/admin.json", cfg, "Настройка доступа руководства", tok);
      TOKEN = tok; PASSWORD = p1; CFG = cfg; showDash();
    } catch (e) { err.textContent = e.status ? ghError(e) : "Не получилось: " + e.message; }
    busy(false);
  };
}
function busy(on){ const b = $("go"), p = $("prog"); if (b) b.disabled = on; if (p) p.style.display = on ? "block" : "none"; }

function showLogin(){
  root().innerHTML = `<div class="card narrow"><h2>Вход для руководства</h2><p class="lead">Введите пароль, чтобы загрузить новое расписание.</p>
    <form id="f"><label>Пароль</label><input type="password" id="pw" autocomplete="current-password" autofocus>
    <button class="primary" id="go" type="submit">Войти</button></form><div class="prog" id="prog"><i></i></div><div class="err" id="err"></div></div>`;
  $("f").onsubmit = async e => {
    e.preventDefault(); const pw = $("pw").value; if (!pw) return; busy(true); $("err").textContent = "";
    try { TOKEN = await unlockToken(CFG, pw); PASSWORD = pw; showDash(); }
    catch (er) { await new Promise(r => setTimeout(r, 900)); $("err").textContent = "Неверный пароль."; busy(false); }
  };
}

/* ---------- панель ---------- */
let META = null, PARSED = null, FILE = null;
async function showDash(){
  $("logout").classList.remove("hidden");
  root().innerHTML = `<div class="card"><h2>Сейчас у всех</h2><div id="cur"><p class="muted">Загружаю…</p></div></div>
    <div class="card"><h2>Загрузить новое расписание</h2><p class="lead">Выберите Excel-файл (.xlsx) в том же формате, что сейчас. Приложение само найдёт группы, дни, время, преподавателей и чередование недель.</p>
      <div class="drop" id="drop"><div style="font-size:30px">📄</div><b>Выбрать файл или перетащить сюда</b><span>.xlsx</span></div>
      <div id="prev"></div></div>
    <div class="card"><h2>Объявление и срок действия</h2><p class="lead">Можно поменять без загрузки нового файла.</p><div id="metaForm"></div></div>
    <div class="card"><h2>Безопасность</h2>
      <details><summary>Сменить пароль</summary><label>Новый пароль</label><input type="password" id="np1" autocomplete="new-password"><label>Ещё раз</label><input type="password" id="np2" autocomplete="new-password"><button class="secondary" id="chpw" style="margin-top:12px">Сменить пароль</button><div class="err" id="pwerr"></div></details>
      <details><summary>Заменить ключ GitHub (если истёк)</summary>${TOKEN_HELP}<label>Новый ключ</label><input type="password" id="ntok" placeholder="github_pat_…"><button class="secondary" id="chtok" style="margin-top:12px">Сохранить новый ключ</button><div class="err" id="tokerr"></div></details></div>`;
  $("drop").onclick = () => $("xlsx").click();
  $("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("drag"); };
  $("drop").ondragleave = () => $("drop").classList.remove("drag");
  $("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f) onFile(f); };
  $("chpw").onclick = async () => {
    const a = $("np1").value, b = $("np2").value, er = $("pwerr"); er.style.color = ""; er.textContent = "";
    if (a.length < 10) return er.textContent = "Не короче 10 символов."; if (a !== b) return er.textContent = "Пароли не совпадают.";
    try { CFG = await lockToken(TOKEN, a); await writeFile("config/admin.json", CFG, "Смена пароля руководства"); PASSWORD = a; er.style.color = "var(--ok)"; er.textContent = "Пароль изменён."; $("np1").value = $("np2").value = ""; }
    catch (e) { er.textContent = ghError(e); }
  };
  $("chtok").onclick = async () => {
    const t = $("ntok").value.trim(), er = $("tokerr"); er.style.color = ""; er.textContent = "";
    if (!/^(github_pat_|ghp_)/.test(t)) return er.textContent = "Вставьте ключ (github_pat_…).";
    try { const cfg = await lockToken(t, PASSWORD); await writeFile("config/admin.json", cfg, "Замена ключа GitHub", t); CFG = cfg; TOKEN = t; er.style.color = "var(--ok)"; er.textContent = "Новый ключ сохранён."; loadMeta(); }
    catch (e) { er.textContent = ghError(e); }
  };
  loadMeta();
}
async function loadMeta(){
  try { META = (await readFile("data/meta.json"))?.json || null; }
  catch (e) { $("cur").innerHTML = `<div class="err">${esc(ghError(e))}</div>`; if (e.status === 401) document.querySelector("details:last-of-type").open = true; return; }
  const p = META && META.period;
  $("cur").innerHTML = META ? `<div class="kv"><div><span>Загружено</span><b>${fmtStamp(META.uploadedAt)}</b></div><div><span>Файл</span><b>${esc(META.fileName || "—")}</b></div>
    <div><span>Действует</span><b>${p && p.from ? `${fmt(fromIso(p.from), { day: "numeric", month: "short" })} – ${fmt(fromIso(p.to), { day: "numeric", month: "short" })}` : "—"}</b></div><div><span>Групп</span><b>${META.groups ?? "—"}</b></div></div>
    ${META.note ? `<p class="muted" style="margin:12px 0 0">Объявление: «${esc(META.note)}»</p>` : ""}` : `<p class="muted">Расписание ещё ни разу не публиковалось.</p>`;
  if (!META) { $("metaForm").innerHTML = `<p class="muted">Появится после первой публикации.</p>`; return; }
  $("metaForm").innerHTML = `${periodFields("m", p?.from, p?.to)}<label>Объявление для всех (необязательно)</label><textarea id="mnote" placeholder="Например: 14 ноября пары с 3-й, ауд. 320 закрыта">${esc(META.note || "")}</textarea>
    <button class="secondary" id="msave" style="margin-top:12px">Сохранить</button><div class="err" id="merr"></div>`;
  bindPeriod("m");
  $("msave").onclick = async () => {
    const er = $("merr"); er.style.color = ""; er.textContent = "Сохраняю…";
    try { const m = { ...META, period: getPeriod("m"), note: $("mnote").value.trim(), metaUpdatedAt: new Date().toISOString() };
      await writeFile("data/meta.json", m, "Объявление / срок действия расписания"); META = m; er.style.color = "var(--ok)"; er.textContent = "Сохранено. У всех обновится в течение нескольких минут."; }
    catch (e) { er.style.color = ""; er.textContent = ghError(e); }
  };
}
function periodFields(px, from, to){
  return `<div class="row"><div><label>Действует с</label><input type="date" id="${px}from" value="${from || ""}"></div><div><label>по</label><input type="date" id="${px}to" value="${to || ""}"></div></div>
    <div class="quick"><button data-q="${px}:this">Эта неделя</button><button data-q="${px}:next">Следующая неделя</button><button data-q="${px}:sem">До конца семестра</button></div>
    <p class="muted" style="margin:8px 0 0">Если открыть дни после этой даты, в приложении появится пометка «расписание может измениться».</p>`;
}
function bindPeriod(px){
  document.querySelectorAll(`[data-q^="${px}:"]`).forEach(b => b.onclick = () => {
    const k = b.dataset.q.split(":")[1], m = monday(new Date());
    if (k === "this") { $(px + "from").value = iso(m); $(px + "to").value = iso(addDays(m, 5)); }
    if (k === "next") { $(px + "from").value = iso(addDays(m, 7)); $(px + "to").value = iso(addDays(m, 12)); }
    if (k === "sem") { const w = (PARSED?.weeks || []).slice(-1)[0]; $(px + "from").value = $(px + "from").value || iso(m); $(px + "to").value = w ? w.to : iso(addDays(m, 60)); }
  });
}
function getPeriod(px){ const f = $(px + "from").value, t = $(px + "to").value; return f && t ? { from: f, to: t } : null; }

$("xlsx").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) onFile(f); };
async function onFile(f){
  FILE = f; PARSED = null; const box = $("prev");
  box.innerHTML = `<p class="muted" style="margin-top:14px">Читаю ${esc(f.name)}…</p>`;
  try {
    const sheets = await readWorkbook(await f.arrayBuffer()); PARSED = parseSchedule(sheets);
  } catch (e) { box.innerHTML = `<div class="err">Не получилось прочитать файл: ${esc(e.message)}</div>`; return; }
  const G = Object.entries(PARSED.groups), lessons = G.reduce((s, [, g]) => s + g.lessons.length, 0);
  const T = new Set(); G.forEach(([, g]) => g.lessons.forEach(l => { const t = teacherName(l.teacher); if (t) T.add(t); }));
  if (!G.length) { box.innerHTML = `<div class="err">В файле не найдено ни одной группы. Нужен формат с колонкой «Время» и названием группы рядом.</div>`; return; }
  // срок из имени файла «02.11-07.11»
  let from = "", to = ""; const m = /(\d{1,2})\.(\d{1,2})\s*[-–_]\s*(\d{1,2})\.(\d{1,2})/.exec(f.name);
  if (m) { const y = mo => (mo >= 8 ? PARSED.yearStart : PARSED.yearStart + 1); from = `${y(+m[2])}-${pad(m[2])}-${pad(m[1])}`; to = `${y(+m[4])}-${pad(m[4])}-${pad(m[3])}`; }
  else { const mo = monday(new Date()); from = iso(mo); to = iso(addDays(mo, 5)); }
  const empty = G.filter(([, g]) => !g.lessons.length).map(([n]) => n);
  box.innerHTML = `<div class="kv" style="margin-top:16px"><div><span>Групп</span><b>${G.length}</b></div><div><span>Пар в неделю</span><b>${lessons}</b></div><div><span>Преподавателей</span><b>${T.size}</b></div><div><span>Недель в графике</span><b>${PARSED.weeks.length || "нет"}</b></div></div>
    <div class="chips">${G.map(([n, g]) => `<span class="${g.lessons.length ? "" : "bad"}">${esc(n)} · ${g.lessons.length}</span>`).join("")}</div>
    ${empty.length ? `<p class="err">У групп ${esc(empty.join(", "))} не найдено ни одной пары — проверьте файл.</p>` : ""}
    ${!PARSED.weeks.length ? `<p class="muted">⚠ В файле нет листа с чередованием недель — чётность будет считаться от 1 сентября.</p>` : ""}
    <details><summary>Преподаватели (${T.size})</summary><p class="muted">${[...T].sort((a, b) => a.localeCompare(b, "ru")).map(esc).join(", ")}</p></details>
    ${periodFields("p", from, to)}
    <label>Объявление для всех (необязательно)</label><textarea id="pnote" placeholder="Появится сверху на главном экране у всех">${esc(META?.note || "")}</textarea>
    <button class="primary big" id="go">Опубликовать для всех</button><div class="prog" id="prog"><i></i></div><div class="err" id="err"></div><div id="done"></div>`;
  bindPeriod("p");
  $("go").onclick = publish;
}
async function publish(){
  const err = $("err"); err.textContent = "";
  const period = getPeriod("p"); if (!period) return err.textContent = "Укажите, с какого по какое число действует расписание.";
  if (period.to < period.from) return err.textContent = "Дата «по» раньше даты «с».";
  busy(true);
  try {
    const now = new Date().toISOString(), version = now + "-" + Math.random().toString(36).slice(2, 7);
    await writeFile("data/schedule.json", { version, uploadedAt: now, fileName: FILE.name, schedule: PARSED }, `Расписание: ${FILE.name}`);
    const meta = { version, uploadedAt: now, fileName: FILE.name, period, note: $("pnote").value.trim(), groups: Object.keys(PARSED.groups).length };
    await writeFile("data/meta.json", meta, `Расписание: ${FILE.name} (сведения)`);
    META = meta; $("go").classList.add("hidden");
    $("done").innerHTML = `<div class="okmsg">✓ Опубликовано ${fmtStamp(now)}. У студентов и преподавателей расписание обновится в течение 1–3 минут: сайту нужно время, чтобы пересобраться.</div>`;
    loadMeta();
  } catch (e) { err.textContent = ghError(e); }
  busy(false);
}
$("logout").onclick = () => { TOKEN = PASSWORD = null; location.reload(); };
start();
</script>
</body>
</html>
